version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://dms:password@postgres:5432/dms
      - MONGODB_URL=mongodb://mongo:27017/dms
      - JWT_SECRET=super-secret-key
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dms
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dms
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
