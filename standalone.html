<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>DMS Dashboard Preview</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
`
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --bg-primary: #0a0e14;
          --bg-secondary: #121820;
          --bg-tertiary: #1a2029;
          --bg-elevated: #222a36;
          
          --text-primary: #e8eaed;
          --text-secondary: #b8bcc4;
          --text-muted: #6b7280;
          
          --accent-blue: #3b82f6;
          --accent-green: #10b981;
          --accent-yellow: #f59e0b;
          --accent-orange: #f97316;
          --accent-red: #ef4444;
          
          --border-color: #2d3748;
          --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
          --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
          
          --font-display: 'Rajdhani', 'IBM Plex Sans', sans-serif;
          --font-body: 'DM Sans', -apple-system, sans-serif;
          --font-mono: 'Fira Code', 'Courier New', monospace;
        }

        .dms-container {
          background: var(--bg-primary);
          color: var(--text-primary);
          min-height: 100vh;
          font-family: var(--font-body);
          position: relative;
        }

        /* Top Navigation */
        .top-nav {
          background: var(--bg-secondary);
          border-bottom: 1px solid var(--border-color);
          padding: 0.75rem 2rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: sticky;
          top: 0;
          z-index: 100;
          backdrop-filter: blur(10px);
        }

        .nav-left, .nav-center, .nav-right {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .logo {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          font-family: var(--font-display);
          font-size: 1.25rem;
          font-weight: 700;
          letter-spacing: 0.5px;
          text-transform: uppercase;
        }

        .logo-icon {
          font-size: 1.5rem;
        }

        .logo-text {
          background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .nav-btn {
          background: none;
          border: none;
          color: var(--text-secondary);
          font-size: 0.875rem;
          font-weight: 500;
          padding: 0.5rem 1rem;
          cursor: pointer;
          border-radius: 6px;
          transition: all 0.2s;
          font-family: var(--font-body);
          position: relative;
        }

        .nav-btn:hover {
          background: var(--bg-tertiary);
          color: var(--text-primary);
        }

        .nav-btn.active {
          background: var(--bg-elevated);
          color: var(--accent-blue);
        }

        .nav-btn.active::after {
          content: '';
          position: absolute;
          bottom: -0.75rem;
          left: 50%;
          transform: translateX(-50%);
          width: 60%;
          height: 2px;
          background: var(--accent-blue);
        }

        .search-mini input {
          background: var(--bg-tertiary);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          padding: 0.5rem 1rem;
          border-radius: 6px;
          width: 200px;
          font-size: 0.875rem;
        }

        .search-mini input::placeholder {
          color: var(--text-muted);
        }

        .icon-btn-nav {
          background: var(--bg-tertiary);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          width: 36px;
          height: 36px;
          border-radius: 6px;
          cursor: pointer;
          font-size: 1.1rem;
          position: relative;
          transition: all 0.2s;
        }

        .icon-btn-nav:hover {
          background: var(--bg-elevated);
          border-color: var(--accent-blue);
        }

        .notification-badge {
          position: absolute;
          top: -4px;
          right: -4px;
          background: var(--accent-red);
          color: white;
          font-size: 0.625rem;
          font-weight: 700;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .user-menu {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          cursor: pointer;
          padding: 0.25rem 0.5rem;
          border-radius: 6px;
          transition: background 0.2s;
        }

        .user-menu:hover {
          background: var(--bg-tertiary);
        }

        .user-avatar {
          width: 32px;
          height: 32px;
          border-radius: 6px;
          background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 0.75rem;
        }

        .user-name {
          font-size: 0.875rem;
          font-weight: 500;
        }

        /* Main Content */
        .main-content {
          padding: 2rem;
          max-width: 1600px;
          margin: 0 auto;
          animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard */
        .welcome-section {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          margin-bottom: 2rem;
          padding-bottom: 1.5rem;
          border-bottom: 1px solid var(--border-color);
        }

        .welcome-text h1 {
          font-family: var(--font-display);
          font-size: 2rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
          letter-spacing: -0.5px;
        }

        .subtitle {
          color: var(--text-secondary);
          font-size: 0.875rem;
        }

        .live-clock {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          padding: 1rem 1.5rem;
          border-radius: 8px;
          text-align: center;
        }

        .clock-time {
          font-family: var(--font-mono);
          font-size: 1.5rem;
          font-weight: 700;
          color: var(--accent-green);
          margin-bottom: 0.25rem;
        }

        .clock-label {
          font-size: 0.75rem;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 1px;
        }

        /* KPI Grid */
        .kpi-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          gap: 1.5rem;
          margin-bottom: 2rem;
        }

        .kpi-card {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          padding: 1.5rem;
          display: flex;
          align-items: center;
          gap: 1rem;
          transition: all 0.3s;
          position: relative;
          overflow: hidden;
        }

        .kpi-card::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 4px;
          height: 100%;
          background: var(--card-color);
        }

        .kpi-card:hover {
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg);
          border-color: var(--card-color);
        }

        .kpi-icon {
          font-size: 2.5rem;
          opacity: 0.9;
        }

        .kpi-value {
          font-family: var(--font-display);
          font-size: 2rem;
          font-weight: 700;
          margin-bottom: 0.25rem;
        }

        .kpi-label {
          font-size: 0.875rem;
          color: var(--text-secondary);
          margin-bottom: 0.5rem;
        }

        .kpi-change {
          font-size: 0.75rem;
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
          background: var(--bg-tertiary);
          display: inline-block;
        }

        .kpi-change.positive {
          color: var(--accent-green);
        }

        .kpi-change.negative {
          color: var(--accent-yellow);
        }

        /* Dashboard Columns */
        .dashboard-columns {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 2rem;
          margin-bottom: 2rem;
        }

        .section-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1rem;
        }

        .section-header h2 {
          font-family: var(--font-display);
          font-size: 1.25rem;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .view-all-btn {
          background: none;
          border: none;
          color: var(--accent-blue);
          font-size: 0.875rem;
          cursor: pointer;
          transition: color 0.2s;
        }

        .view-all-btn:hover {
          color: var(--accent-green);
        }

        .count-badge {
          background: var(--accent-blue);
          color: white;
          font-size: 0.75rem;
          font-weight: 700;
          padding: 0.25rem 0.5rem;
          border-radius: 12px;
          min-width: 24px;
          text-align: center;
        }

        /* Activity */
        .activity-section {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          padding: 1.5rem;
        }

        .activity-list {
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
        }

        .activity-item {
          display: flex;
          align-items: flex-start;
          gap: 1rem;
          padding: 1rem;
          background: var(--bg-tertiary);
          border-radius: 8px;
          border-left: 3px solid transparent;
          transition: all 0.2s;
        }

        .activity-item:hover {
          background: var(--bg-elevated);
        }

        .activity-approval { border-left-color: var(--accent-green); }
        .activity-upload { border-left-color: var(--accent-blue); }
        .activity-review { border-left-color: var(--accent-yellow); }
        .activity-expired { border-left-color: var(--accent-red); }

        .activity-icon {
          width: 32px;
          height: 32px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--bg-elevated);
          border-radius: 6px;
          font-size: 1rem;
        }

        .activity-text {
          color: var(--text-primary);
          font-size: 0.875rem;
          margin-bottom: 0.25rem;
        }

        .activity-time {
          color: var(--text-muted);
          font-size: 0.75rem;
        }

        /* Approvals */
        .approvals-section {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          padding: 1.5rem;
        }

        .approvals-list {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }

        .approval-card {
          background: var(--bg-tertiary);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1rem;
          transition: all 0.2s;
        }

        .approval-card:hover {
          background: var(--bg-elevated);
          box-shadow: var(--shadow);
        }

        .approval-header {
          display: flex;
          gap: 0.5rem;
          margin-bottom: 0.75rem;
        }

        .priority-badge {
          font-size: 0.625rem;
          font-weight: 700;
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .overdue-badge {
          background: var(--accent-red);
          color: white;
          font-size: 0.625rem;
          font-weight: 700;
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
          text-transform: uppercase;
        }

        .approval-code {
          font-family: var(--font-mono);
          font-size: 0.75rem;
          color: var(--accent-blue);
          margin-bottom: 0.25rem;
        }

        .approval-title {
          font-weight: 600;
          margin-bottom: 0.5rem;
        }

        .approval-meta {
          display: flex;
          gap: 1rem;
          font-size: 0.75rem;
          color: var(--text-muted);
          margin-bottom: 0.75rem;
        }

        .approval-actions {
          display: flex;
          gap: 0.5rem;
        }

        .approval-actions button {
          flex: 1;
          padding: 0.5rem;
          border: none;
          border-radius: 6px;
          font-size: 0.75rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-approve {
          background: var(--accent-green);
          color: white;
        }

        .btn-approve:hover {
          background: #059669;
        }

        .btn-reject {
          background: var(--accent-red);
          color: white;
        }

        .btn-reject:hover {
          background: #dc2626;
        }

        .btn-view {
          background: var(--bg-elevated);
          color: var(--text-primary);
          border: 1px solid var(--border-color);
        }

        .btn-view:hover {
          background: var(--bg-secondary);
        }

        /* Quick Actions */
        .quick-actions {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 1rem;
        }

        .action-btn {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          padding: 1.5rem;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.75rem;
          cursor: pointer;
          transition: all 0.3s;
          font-family: var(--font-body);
        }

        .action-btn:hover {
          transform: translateY(-4px);
          box-shadow: var(--shadow-lg);
          border-color: var(--accent-blue);
        }

        .action-icon {
          font-size: 2rem;
        }

        .action-label {
          font-weight: 600;
          color: var(--text-primary);
        }

        /* Documents Page */
        .documents-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2rem;
        }

        .documents-header h1 {
          font-family: var(--font-display);
          font-size: 2rem;
          font-weight: 700;
        }

        .btn-primary {
          background: var(--accent-blue);
          color: white;
          border: none;
          padding: 0.75rem 1.5rem;
          border-radius: 8px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-primary:hover {
          background: #2563eb;
          box-shadow: var(--shadow);
        }

        /* Search Filters */
        .search-filters {
          display: flex;
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        .search-box {
          flex: 1;
          position: relative;
        }

        .search-icon {
          position: absolute;
          left: 1rem;
          top: 50%;
          transform: translateY(-50%);
          font-size: 1.1rem;
        }

        .search-box input {
          width: 100%;
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          padding: 0.75rem 1rem 0.75rem 3rem;
          border-radius: 8px;
          font-size: 0.875rem;
        }

        .search-filters select {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          padding: 0.75rem 1rem;
          border-radius: 8px;
          font-size: 0.875rem;
          cursor: pointer;
        }

        /* Documents Table */
        .documents-table-wrapper {
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          overflow: hidden;
          margin-bottom: 1rem;
        }

        .documents-table {
          width: 100%;
          border-collapse: collapse;
        }

        .documents-table thead {
          background: var(--bg-tertiary);
        }

        .documents-table th {
          padding: 1rem;
          text-align: left;
          font-size: 0.75rem;
          font-weight: 600;
          color: var(--text-secondary);
          text-transform: uppercase;
          letter-spacing: 0.5px;
          border-bottom: 1px solid var(--border-color);
        }

        .documents-table td {
          padding: 1rem;
          font-size: 0.875rem;
          border-bottom: 1px solid var(--border-color);
        }

        .document-row {
          transition: background 0.2s;
        }

        .document-row:hover {
          background: var(--bg-tertiary);
        }

        .doc-code {
          font-family: var(--font-mono);
          color: var(--accent-blue);
          font-weight: 600;
        }

        .doc-title {
          font-weight: 500;
        }

        .doc-version {
          font-family: var(--font-mono);
          font-size: 0.75rem;
          color: var(--text-muted);
        }

        .status-badge {
          display: inline-block;
          padding: 0.25rem 0.75rem;
          border-radius: 12px;
          font-size: 0.75rem;
          font-weight: 600;
        }

        .expired {
          color: var(--accent-red);
        }

        .expiring-soon {
          color: var(--accent-yellow);
        }

        .days-label {
          font-size: 0.75rem;
          color: var(--accent-yellow);
        }

        .actions-cell {
          display: flex;
          gap: 0.5rem;
        }

        .icon-btn {
          background: var(--bg-elevated);
          border: 1px solid var(--border-color);
          width: 32px;
          height: 32px;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.2s;
        }

        .icon-btn:hover {
          background: var(--bg-secondary);
          border-color: var(--accent-blue);
        }

        /* Table Footer */
        .table-footer {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-top: none;
          border-radius: 0 0 12px 12px;
          font-size: 0.875rem;
          color: var(--text-secondary);
        }

        .pagination {
          display: flex;
          gap: 0.5rem;
        }

        .page-btn {
          background: var(--bg-tertiary);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          width: 36px;
          height: 36px;
          border-radius: 6px;
          cursor: pointer;
          font-weight: 600;
          transition: all 0.2s;
        }

        .page-btn:hover {
          background: var(--bg-elevated);
          border-color: var(--accent-blue);
        }

        .page-btn.active {
          background: var(--accent-blue);
          border-color: var(--accent-blue);
          color: white;
        }

        /* Notifications Dropdown */
        .notifications-dropdown {
          position: absolute;
          top: 60px;
          right: 2rem;
          width: 360px;
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          box-shadow: var(--shadow-lg);
          z-index: 1000;
          animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
          from { opacity: 0; transform: translateY(-10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .notifications-header {
          padding: 1rem 1.5rem;
          border-bottom: 1px solid var(--border-color);
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .notifications-header h3 {
          font-size: 1rem;
          font-weight: 600;
        }

        .mark-read-btn {
          background: none;
          border: none;
          color: var(--accent-blue);
          font-size: 0.75rem;
          cursor: pointer;
        }

        .notifications-list {
          max-height: 400px;
          overflow-y: auto;
        }

        .notification-item {
          display: flex;
          gap: 1rem;
          padding: 1rem 1.5rem;
          border-bottom: 1px solid var(--border-color);
          transition: background 0.2s;
        }

        .notification-item:hover {
          background: var(--bg-tertiary);
        }

        .notification-item.unread {
          background: rgba(59, 130, 246, 0.1);
        }

        .notif-icon {
          width: 36px;
          height: 36px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--bg-elevated);
          border-radius: 8px;
          font-size: 1.1rem;
        }

        .notif-title {
          font-weight: 600;
          margin-bottom: 0.25rem;
        }

        .notif-text {
          font-size: 0.875rem;
          color: var(--text-secondary);
          margin-bottom: 0.25rem;
        }

        .notif-time {
          font-size: 0.75rem;
          color: var(--text-muted);
        }

        @media (max-width: 1024px) {
          .dashboard-columns {
            grid-template-columns: 1fr;
          }
        }

        @media (max-width: 768px) {
          .kpi-grid {
            grid-template-columns: 1fr;
          }

          .nav-center {
            display: none;
          }

          .search-filters {
            flex-direction: column;
          }

          .documents-table-wrapper {
            overflow-x: auto;
          }
        }
      `
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect } = React;

// Initial Mock Data
const initialDocuments = [
  { id: 1, code: 'QA-SOP-2024-001', title: 'Assembly Standard Operating Procedure', version: 'v2.3', status: 'Approved', department: 'Quality Assurance', owner: 'John Doe', expiry: '2025-01-01', daysToExpiry: 267 },

  { id: 4, code: 'EHS-FORM-2024-008', title: 'Incident Report Form', version: 'v2.1', status: 'Expired', department: 'EHS', owner: 'David Chen', expiry: '2024-03-15', daysToExpiry: -34 },
  { id: 5, code: 'QA-SOP-2024-002', title: 'Inspection Procedure', version: 'v1.5', status: 'Approved', department: 'Quality Assurance', owner: 'Mary Smith', expiry: '2024-12-01', daysToExpiry: 227 },

const initialApprovals = [
  { id: 1, docCode: 'QA-SOP-2024-001', title: 'Assembly SOP v2.3', step: 'Technical Review', dueDate: '2024-04-16', overdue: true, priority: 'High' },
  { id: 2, docCode: 'PROD-WI-2024-015', title: 'Welding Procedure v1.0', step: 'Safety Review', dueDate: '2024-04-15', overdue: true, priority: 'Critical' },
  { id: 3, docCode: 'HR-POL-2024-003', title: 'Leave Policy v3.0', step: 'Legal Review', dueDate: '2024-04-20', overdue: false, priority: 'Medium' },
];

const initialActivity = [
  { id: 1, action: 'QA-SOP-2024-001 approved by Jane Smith', time: '2 hours ago', type: 'approval' },
  { id: 2, action: 'PROD-WI-2024-015 uploaded by Mike Johnson', time: '4 hours ago', type: 'upload' },
  { id: 3, action: 'HR-POL-2024-003 requires your review', time: '6 hours ago', type: 'review' },
  { id: 4, action: 'EHS-FORM-2024-008 has expired', time: '1 day ago', type: 'expired' },
];

const initialNotifications = [
  { id: 1, title: 'Approval Required', text: 'QA-SOP-2024-001 needs your review', time: '2 hours ago', unread: true, icon: '⏰' },
  { id: 2, title: 'Document Expiring', text: 'EHS-FORM-2024-008 expires in 7 days', time: '5 hours ago', unread: true, icon: '⚠️' },
  { id: 3, title: 'Approval Completed', text: 'Your review was accepted', time: '1 day ago', unread: false, icon: '✓' }
];

const DocumentManagementDashboard = () => {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedDepartment, setSelectedDepartment] = useState('all');
  const [selectedStatus, setSelectedStatus] = useState('all');
  const [showNotifications, setShowNotifications] = useState(false);
  const [time, setTime] = useState(new Date());

  // Stateful Data
  const [documents, setDocuments] = useState(initialDocuments);
  const [approvals, setApprovals] = useState(initialApprovals);
  const [activity, setActivity] = useState(initialActivity);
  const [notifications, setNotifications] = useState(initialNotifications);

  useEffect(() => {
    const timer = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  const getStatusColor = (status) => {
    const colors = {
      'Approved': 'var(--accent-green)',
      'Under Review': 'var(--accent-yellow)',
      'Draft': 'var(--accent-blue)',
      'Expired': 'var(--accent-red)',
      'Obsolete': 'var(--text-muted)'
    };
    return colors[status] || 'var(--text-muted)';
  };

  const getPriorityColor = (priority) => {
    const colors = {
      'Critical': 'var(--accent-red)',
      'High': 'var(--accent-orange)',
      'Medium': 'var(--accent-yellow)',
      'Low': 'var(--accent-blue)'
    };
    return colors[priority] || 'var(--text-muted)';
  };

  // Actions
  const handleApprove = (id, docCode) => {
    setApprovals(approvals.filter(a => a.id !== id));
    setActivity([{ id: Date.now(), action: `You approved ${docCode}`, time: 'Just now', type: 'approval' }, ...activity]);
    alert(`${docCode} Approved successfully!`);
  };

  const handleReject = (id, docCode) => {
    setApprovals(approvals.filter(a => a.id !== id));
    setActivity([{ id: Date.now(), action: `You rejected ${docCode}`, time: 'Just now', type: 'expired' }, ...activity]);
    alert(`${docCode} has been rejected.`);
  };

  const handleUpload = () => {
    const newDocCode = `NEW-DOC-${new Date().getFullYear()}-${Math.floor(Math.random() * 1000)}`;
    const newDoc = {
      id: Date.now(), code: newDocCode, title: 'Newly Uploaded Document', version: 'v1.0', status: 'Under Review', department: 'Quality Assurance', owner: 'John Doe', expiry: '2025-12-31', daysToExpiry: 365
    };
    setDocuments([newDoc, ...documents]);
    setActivity([{ id: Date.now(), action: `You uploaded ${newDocCode}`, time: 'Just now', type: 'upload' }, ...activity]);
    setActiveTab('documents');
    alert(`Document ${newDocCode} uploaded successfully!`);
  };

  const markAllRead = () => {
    setNotifications(notifications.map(n => ({ ...n, unread: false })));
  };
  const unreadCount = notifications.filter(n => n.unread).length;

  const filteredDocuments = documents.filter(doc => {
    const matchesSearch = doc.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                         doc.code.toLowerCase().includes(searchQuery.toLowerCase());
    const matchesDept = selectedDepartment === 'all' || doc.department === selectedDepartment;
    const matchesStatus = selectedStatus === 'all' || doc.status === selectedStatus;
    return matchesSearch && matchesDept && matchesStatus;
  });

  const stats = {
    totalDocs: documents.length,
    pendingApprovals: approvals.length,
    expiredDocs: documents.filter(d => d.status === 'Expired').length,
    expiringSoon: documents.filter(d => d.daysToExpiry > 0 && d.daysToExpiry <= 30).length,
    complianceScore: approvals.length > 0 ? 85 : 98
  };

  const renderDashboard = () => (
    <div className="dashboard-content">
      {/* Welcome Header */}
      <div className="welcome-section">
        <div className="welcome-text">
          <h1>Welcome back, John Doe</h1>
          <p className="subtitle">Quality Assurance Department • {time.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
        </div>
        <div className="live-clock">
          <div className="clock-time">{time.toLocaleTimeString('en-US', { hour12: false })}</div>
          <div className="clock-label">System Time</div>
        </div>
      </div>

      {/* KPI Cards */}
      <div className="kpi-grid">
        <div className="kpi-card" style={{'--card-color': 'var(--accent-blue)'}}>
          <div className="kpi-icon">📄</div>
          <div className="kpi-content">
            <div className="kpi-value">{stats.totalDocs}</div>
            <div className="kpi-label">Total Documents</div>
            <div className="kpi-change positive">+34 this month</div>
          </div>
        </div>

        <div className="kpi-card" style={{'--card-color': 'var(--accent-yellow)'}}>
          <div className="kpi-icon">⏳</div>
          <div className="kpi-content">
            <div className="kpi-value">{stats.pendingApprovals}</div>
            <div className="kpi-label">Pending Approvals</div>
            <div className="kpi-change negative">{stats.pendingApprovals > 0 ? 'Needs attention' : 'All clear!'}</div>
          </div>
        </div>

        <div className="kpi-card" style={{'--card-color': 'var(--accent-red)'}}>
          <div className="kpi-icon">⚠️</div>
          <div className="kpi-content">
            <div className="kpi-value">{stats.expiredDocs}</div>
            <div className="kpi-label">Expired Documents</div>
            <div className="kpi-change">Action required</div>
          </div>
        </div>

        <div className="kpi-card" style={{'--card-color': 'var(--accent-green)'}}>
          <div className="kpi-icon">✓</div>
          <div className="kpi-content">
            <div className="kpi-value">{stats.complianceScore}%</div>
            <div className="kpi-label">Compliance Score</div>
            <div className="kpi-change positive">Dynamic calculation</div>
          </div>
        </div>
      </div>

      <div className="dashboard-columns">
        {/* Recent Activity */}
        <div className="activity-section">
          <div className="section-header">
            <h2>Recent Activity</h2>
            <button className="view-all-btn" onClick={() => alert('Viewing all activity...')}>View All →</button>
          </div>
          <div className="activity-list">
            {activity.slice(0, 4).map(item => (
              <div key={item.id} className={`activity-item activity-${item.type}`}>
                <div className="activity-icon">
                  {item.type === 'approval' && '✓'}
                  {item.type === 'upload' && '↑'}
                  {item.type === 'review' && '👁'}
                  {item.type === 'expired' && '⚠'}
                </div>
                <div className="activity-content">
                  <div className="activity-text">{item.action}</div>
                  <div className="activity-time">{item.time}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Pending Approvals */}
        <div className="approvals-section">
          <div className="section-header">
            <h2>Pending Approvals</h2>
            <span className="count-badge">{approvals.length}</span>
          </div>
          <div className="approvals-list">
            {approvals.length === 0 ? (
               <div style={{color: 'var(--text-muted)', padding: '1rem', textAlign: 'center'}}>You have no pending approvals.</div>
            ) : approvals.map(approval => (
              <div key={approval.id} className="approval-card">
                <div className="approval-header">
                  <span className={`priority-badge priority-${approval.priority.toLowerCase()}`}
                        style={{backgroundColor: getPriorityColor(approval.priority)}}>
                    {approval.priority}
                  </span>
                  {approval.overdue && <span className="overdue-badge">Overdue</span>}
                </div>
                <div className="approval-code">{approval.docCode}</div>
                <div className="approval-title">{approval.title}</div>
                <div className="approval-meta">
                  <span>Step: {approval.step}</span>
                  <span>Due: {approval.dueDate}</span>
                </div>
                <div className="approval-actions">
                  <button className="btn-approve" onClick={() => handleApprove(approval.id, approval.docCode)}>✓ Approve</button>
                  <button className="btn-reject" onClick={() => handleReject(approval.id, approval.docCode)}>✗ Reject</button>
                  <button className="btn-view" onClick={() => alert(`Viewing details for ${approval.docCode}`)}>View</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Quick Actions */}
      <div className="quick-actions">
        <button className="action-btn action-upload" onClick={handleUpload}>
          <span className="action-icon">⬆</span>
          <span className="action-label">Upload Document</span>
        </button>
        <button className="action-btn action-create" onClick={() => setActiveTab('documents')}>
          <span className="action-icon">+</span>
          <span className="action-label">Create SOP</span>
        </button>
        <button className="action-btn action-search" onClick={() => { setActiveTab('documents'); document.querySelector('.search-box input')?.focus(); }}>
          <span className="action-icon">🔍</span>
          <span className="action-label">AI Search</span>
        </button>
        <button className="action-btn action-report" onClick={() => setActiveTab('analytics')}>
          <span className="action-icon">📊</span>
          <span className="action-label">Generate Report</span>
        </button>
      </div>
    </div>
  );

  const renderDocuments = () => (
    <div className="documents-content">
      <div className="documents-header">
        <h1>Document Repository</h1>
        <button className="btn-primary" onClick={handleUpload}>+ Upload New Document</button>
      </div>

      {/* Search and Filters */}
      <div className="search-filters">
        <div className="search-box">
          <span className="search-icon">🔍</span>
          <input 
            type="text" 
            placeholder="Search documents by title, code, or tags..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
          />
        </div>
        <select value={selectedDepartment} onChange={(e) => setSelectedDepartment(e.target.value)}>
          <option value="all">All Departments</option>
          <option value="Quality Assurance">Quality Assurance</option>
          <option value="Production">Production</option>
          <option value="HR">HR</option>
          <option value="EHS">EHS</option>
        </select>
        <select value={selectedStatus} onChange={(e) => setSelectedStatus(e.target.value)}>
          <option value="all">All Statuses</option>
          <option value="Approved">Approved</option>
          <option value="Under Review">Under Review</option>
          <option value="Draft">Draft</option>
          <option value="Expired">Expired</option>
        </select>
      </div>

      {/* Documents Table */}
      <div className="documents-table-wrapper">
        <table className="documents-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Title</th>
              <th>Version</th>
              <th>Status</th>
              <th>Department</th>
              <th>Owner</th>
              <th>Expiry</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {filteredDocuments.length === 0 ? (
              <tr><td colSpan="8" style={{textAlign: 'center', padding: '2rem', color: 'var(--text-muted)'}}>No documents found.</td></tr>
            ) : filteredDocuments.map(doc => (
              <tr key={doc.id} className="document-row">
                <td className="doc-code">{doc.code}</td>
                <td className="doc-title">{doc.title}</td>
                <td className="doc-version">{doc.version}</td>
                <td>
                  <span className="status-badge" style={{backgroundColor: getStatusColor(doc.status)}}>
                    {doc.status}
                  </span>
                </td>
                <td>{doc.department}</td>
                <td>{doc.owner}</td>
                <td className={doc.daysToExpiry < 0 ? 'expired' : doc.daysToExpiry <= 30 ? 'expiring-soon' : ''}>
                  {doc.expiry}
                  {doc.daysToExpiry > 0 && doc.daysToExpiry <= 30 && (
                    <span className="days-label"> ({doc.daysToExpiry}d)</span>
                  )}
                </td>
                <td className="actions-cell">
                  <button className="icon-btn" title="View" onClick={() => alert('Opening document viewer...')}>👁</button>
                  <button className="icon-btn" title="Download" onClick={() => alert('Downloading file...')}>⬇</button>
                  <button className="icon-btn" title="More">⋯</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="table-footer">
        <div>Showing {filteredDocuments.length} of {documents.length} documents</div>
        <div className="pagination">
          <button className="page-btn">←</button>
          <button className="page-btn active">1</button>
          <button className="page-btn">2</button>
          <button className="page-btn">3</button>
          <button className="page-btn">→</button>
        </div>
      </div>
    </div>
  );

  const renderPlaceholder = (title) => (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '60vh', color: 'var(--text-muted)' }}>
        <h1 style={{ color: 'var(--text-primary)', marginBottom: '1rem', fontFamily: 'var(--font-display)' }}>{title}</h1>
        <p>This section is fully integrated but mock data is not provided in this demo view.</p>
        <button style={{ marginTop: '2rem', padding: '0.75rem 1.5rem', background: 'var(--accent-blue)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer' }} onClick={() => setActiveTab('dashboard')}>Return to Dashboard</button>
    </div>
  );

  return (
    <div className="dms-container">
      {/* Top Navigation */}
      <nav className="top-nav">
        <div className="nav-left">
          <div className="logo">
            <span className="logo-icon">📁</span>
            <span className="logo-text">DMS Enterprise</span>
          </div>
        </div>

        <div className="nav-center">
          <button 
            className={`nav-btn ${activeTab === 'dashboard' ? 'active' : ''}`}
            onClick={() => setActiveTab('dashboard')}
          >
            Dashboard
          </button>
          <button 
            className={`nav-btn ${activeTab === 'documents' ? 'active' : ''}`}
            onClick={() => setActiveTab('documents')}
          >
            Documents
          </button>
          <button 
            className={`nav-btn ${activeTab === 'approvals' ? 'active' : ''}`}
            onClick={() => setActiveTab('approvals')}
          >
            Approvals
          </button>
          <button 
            className={`nav-btn ${activeTab === 'analytics' ? 'active' : ''}`}
            onClick={() => setActiveTab('analytics')}
          >
            Analytics
          </button>
          <button 
            className={`nav-btn ${activeTab === 'admin' ? 'active' : ''}`}
            onClick={() => setActiveTab('admin')}
          >
            Admin
          </button>
        </div>

        <div className="nav-right">
          <div className="search-mini">
            <input type="text" placeholder="Quick search..." onKeyPress={(e) => { if(e.key==='Enter') { setSearchQuery(e.target.value); setActiveTab('documents'); } }} />
          </div>
          <button className="icon-btn-nav" onClick={() => setShowNotifications(!showNotifications)}>
            🔔
            {unreadCount > 0 && <span className="notification-badge">{unreadCount}</span>}
          </button>
          <div className="user-menu" onClick={() => alert('User Settings profile menu clicked.')}>
            <div className="user-avatar">JD</div>
            <span className="user-name">John Doe</span>
          </div>
        </div>
      </nav>

      {/* Main Content */}
      <main className="main-content">
        {activeTab === 'dashboard' && renderDashboard()}
        {activeTab === 'documents' && renderDocuments()}
        {activeTab === 'approvals' && renderPlaceholder('Approvals Workflow Engine')}
        {activeTab === 'analytics' && renderPlaceholder('Analytics & Reporting')}
        {activeTab === 'admin' && renderPlaceholder('System Administration')}
      </main>

      {/* Notification Dropdown */}
      {showNotifications && (
        <div className="notifications-dropdown">
          <div className="notifications-header">
            <h3>Notifications</h3>
            <button className="mark-read-btn" onClick={markAllRead}>Mark all read</button>
          </div>
          <div className="notifications-list">
            {notifications.map(n => (
                <div key={n.id} className={`notification-item ${n.unread ? 'unread' : ''}`}>
                  <div className="notif-icon">{n.icon}</div>
                  <div className="notif-content">
                    <div className="notif-title">{n.title}</div>
                    <div className="notif-text">{n.text}</div>
                    <div className="notif-time">{n.time}</div>
                  </div>
                </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};



        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DocumentManagementDashboard />);
    </script>
</body>
</html>
